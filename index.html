      /* Micro-animations */
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes pop { 0% { transform: scale(.95); } 100% { transform: scale(1); } }
      .rise { animation: rise .45s cubic-bezier(.16, 1, .3, 1) backwards; }
      .floaty { animation: floaty 5s ease-in-out infinite; }
      .pop { animation: pop .25s ease-out; }
      @media (prefers-reduced-motion: reduce) {
        .rise, .floaty, .pop { animation: none !important; }
      }

      /* Form feedback */
      .field:focus { outline: none; border-color: #1F3A6D; box-shadow: 0 0 0 3px rgba(31, 58, 109, 0.12); }
      .field:user-invalid { border-color: #EE7A3B; box-shadow: 0 0 0 3px rgba(238, 122, 59, 0.15); }

      /* Modern Clean Scrollbar */
      * { scrollbar-width: thin; scrollbar-color: #CBD5E1 transparent; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
      ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
